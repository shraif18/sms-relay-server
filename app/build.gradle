plugins {
    id 'com.android.application'
}

// Release signing comes from CI secrets (see .github/workflows/build.yml).
// The same key must sign every release, or installed apps can't be updated.
def signingKeystore = System.getenv('SIGNING_KEYSTORE_PATH')

android {
    namespace 'com.yourname.smsforwarder'
    compileSdk 33

    defaultConfig {
        // Final, distributable app ID (changing it later breaks updates).
        applicationId "il.co.brownins.otprelay"
        minSdk 24
        targetSdk 33
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger())
        versionName "2.0.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
    }

    signingConfigs {
        release {
            if (signingKeystore) {
                storeFile file(signingKeystore)
                storeType 'pkcs12'
                storePassword System.getenv('SIGNING_STORE_PASSWORD')
                keyAlias 'release'
                keyPassword System.getenv('SIGNING_STORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.squareup.okhttp3:okhttp:4.10.0'
}
